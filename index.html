:root{
  --laut:#0E1A2B;
  --kayu:#16263B;
  --kayu-2:#213852;
  --emas:#E6B64C;
  --emas-redup:#7D6633;
  --kapas:#F1EBDD;
  --kabut:#93A1B8;
  --kabut-2:#55657E;
  --sutra:#E24D8B;
  --fs-0:.8rem;
  --fs-1:1rem;
  --fs-2:1.25rem;
  --fs-3:1.5625rem;
  --fs-4:1.953rem;
  --radius:12px;
  --script:"Noto Sans Buginese","Leelawadee UI","Noto Sans","Segoe UI",sans-serif;
}

*{box-sizing:border-box}
html{font-size:clamp(16px,1.05vw + 5px,26px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  background:var(--laut);color:var(--kapas);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:400;line-height:1.5;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--emas);outline-offset:3px}

/* ---------- Baris atas ---------- */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:.75rem 2rem;flex-wrap:wrap;
  padding:.8rem 4vw .2rem;
}
.bar-title{display:flex;flex-direction:column;gap:.05rem}
.bar-title h1{margin:0;font-size:var(--fs-2);font-weight:600;letter-spacing:-.005em;line-height:1.2}
.bar-title p{margin:0;font-size:var(--fs-0);color:var(--kabut);line-height:1.3}
.bar-tools{display:flex;align-items:center;gap:.75rem 1.25rem;flex-wrap:wrap}

.seg{display:inline-flex;align-items:center;gap:.6rem;font-size:var(--fs-0);color:var(--kabut)}
.seg-pills{display:inline-flex;padding:3px;border:1px solid var(--kabut-2);border-radius:999px}
.seg label{position:relative}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:block;padding:.28rem .85rem;border-radius:999px;color:var(--kabut);transition:background .15s,color .15s}
.seg input:checked+span{background:var(--kapas);color:var(--laut);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--emas);outline-offset:2px}

.btn-quiet{
  background:none;border:1px solid var(--kabut-2);border-radius:999px;
  padding:.3rem .9rem;font-size:var(--fs-0);color:var(--kapas);
}
.btn-quiet:hover{border-color:var(--kabut)}
.btn-quiet[data-done="1"]{border-color:var(--emas);color:var(--emas)}

/* ---------- Panggung ---------- */
.stage{
  flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  width:min(1600px,100%);margin:0 auto;padding:.4rem 4vw .6rem;gap:.75rem;
}
.hero{width:100%;text-align:center}
.hero-row{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;
  column-gap:.55em;row-gap:.1em;
  font-size:120px; /* dihitung ulang lewat JS */
  min-height:1.45em;
}
.word{display:inline-flex;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;padding:0 .035em}
.glyph{
  font-family:var(--script);color:var(--emas);
  line-height:1.22;white-space:nowrap;
}
.gloss{
  font-size:max(13px,.13em);line-height:1.2;color:var(--kabut);
  margin-top:-.15em;font-weight:500;letter-spacing:.01em;white-space:nowrap;
}
.hero.is-demo .glyph{color:var(--emas-redup)}
.hero.is-demo .gloss{color:var(--kabut-2)}
.hero-name{
  margin:.2rem 0 0;font-size:var(--fs-4);font-weight:500;letter-spacing:-.01em;line-height:1.2;
}
.hero.is-demo .hero-name{color:var(--kabut)}
.note{
  margin:.35rem auto 0;max-width:62ch;font-size:var(--fs-1);color:var(--kabut);line-height:1.45;
}
.note b{color:var(--kapas);font-weight:600}

@keyframes write{
  from{opacity:0;transform:translateY(.06em) scale(.94)}
  to{opacity:1;transform:none}
}
.cell.in{animation:write .45s cubic-bezier(.2,.7,.2,1) both}

/* ---------- Masukan ---------- */
.entry{display:flex;gap:.6rem;width:min(820px,100%);margin-top:.25rem}
.field{flex:1;position:relative;min-width:0}
.field input{
  width:100%;font:inherit;font-size:var(--fs-3);font-weight:500;
  padding:.5em 2.2em .5em .9em;
  background:var(--kayu);color:var(--kapas);
  border:1px solid var(--kabut-2);border-radius:var(--radius);
  caret-color:var(--emas);
}
.field input::placeholder{color:var(--kabut-2);font-weight:400}
.field input:focus{outline:2px solid var(--emas);outline-offset:2px;border-color:transparent}
.clear{
  position:absolute;right:.45em;top:50%;transform:translateY(-50%);
  width:2em;height:2em;border:0;border-radius:50%;background:none;color:var(--kabut);
  font-size:var(--fs-2);line-height:1;display:grid;place-items:center;
}
.clear:hover{background:var(--kayu-2);color:var(--kapas)}
.clear[hidden]{display:none}

.mic{
  display:inline-flex;align-items:center;gap:.6em;
  padding:0 1.15em;border:1px solid var(--kabut);border-radius:var(--radius);
  background:transparent;color:var(--kapas);font-size:var(--fs-2);font-weight:500;white-space:nowrap;
  transition:border-color .15s,color .15s,background .15s;
}
.mic:hover{background:var(--kayu)}
.mic:disabled{cursor:not-allowed;color:var(--kabut-2);border-color:var(--kabut-2)}
.rhomb{width:.62em;height:.62em;flex:none;transform:rotate(45deg);background:currentColor;border-radius:2px}
.mic.is-listening{color:var(--sutra);border-color:var(--sutra);background:rgba(226,77,139,.08)}
@keyframes breathe{
  0%,100%{transform:rotate(45deg) scale(1);opacity:1}
  50%{transform:rotate(45deg) scale(1.35);opacity:.55}
}
.mic.is-listening .rhomb{animation:breathe 1.1s ease-in-out infinite}

.hint{
  margin:0;font-size:var(--fs-0);color:var(--kabut);text-align:center;max-width:72ch;line-height:1.4;
}
.hint[data-kind="error"]{color:var(--kapas)}
.chips{
  margin:-.45rem 0 0;font-size:var(--fs-0);color:var(--kabut);
  display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem .5rem;align-items:baseline;
}
.chip{
  background:none;border:0;padding:0 .1rem;color:var(--kapas);
  border-bottom:1px solid var(--kabut-2);line-height:1.3;
}
.chip:hover{border-bottom-color:var(--emas);color:var(--emas)}

/* ---------- Bagan huruf ---------- */
.chart{
  display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem 2rem;
  width:100%;margin-top:.1rem;
}
.chart-group{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;justify-content:center}
.chart-cap{margin:0;font-size:var(--fs-0);color:var(--kabut-2);white-space:nowrap}
.chart ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.15rem;justify-content:center}
.chart li{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  min-width:2.05rem;padding:.1rem .25rem .15rem;border-radius:8px;color:var(--kabut-2);
  transition:background .2s,color .2s;
}
.chart .g{font-family:var(--script);font-size:1.3rem;line-height:1.2;color:var(--kabut-2);transition:color .2s}
.chart .l{font-size:.68rem;line-height:1.2}
.chart li.on{background:var(--kayu);color:var(--kapas)}
.chart li.on .g{color:var(--emas)}

/* ---------- Kaki ---------- */
.foot{
  display:flex;justify-content:space-between;align-items:center;gap:.5rem 1rem;flex-wrap:wrap;
  padding:.2rem 4vw .7rem;font-size:var(--fs-0);color:var(--kabut-2);
}
.foot p{margin:0}
.foot kbd{
  font:inherit;font-size:.9em;padding:0 .35em;border:1px solid var(--kabut-2);border-radius:4px;color:var(--kabut);
}

/* ---------- Mode pajang ---------- */
body.pajang .bar,body.pajang .chart,body.pajang .foot,body.pajang .hint,body.pajang .chips{display:none}
body.pajang .stage{gap:2rem}
body.pajang .entry{opacity:.22;transition:opacity .25s}
body.pajang .entry:hover,body.pajang .entry:focus-within{opacity:1}

@media (max-width:720px){
  .entry{flex-direction:column}
  .mic{justify-content:center;padding:.6em 1em}
  .bar{padding-top:.75rem}
}
@media (prefers-reduced-motion:reduce){
  .cell.in{animation:none}
  .mic.is-listening .rhomb{animation:none;transform:rotate(45deg) scale(1.2)}
  .seg span,.mic,.chart li,.chart .g{transition:none}
}

<body>

<header class="bar">
  <div class="bar-title">
    <h1>Namamu dalam Lontara</h1>
    <p>Aksara Bugis–Makassar dari Sulawesi Selatan</p>
  </div>
  <div class="bar-tools">
    <div class="seg" role="radiogroup" aria-label="Ejaan">
      <span>Ejaan</span>
      <div class="seg-pills">
        <label><input type="radio" name="mode" value="trad" checked><span>Tradisional</span></label>
        <label><input type="radio" name="mode" value="full"><span>Lengkap</span></label>
      </div>
    </div>
    <button class="btn-quiet" id="btnCopy" type="button">Salin teks Lontara</button>
    <button class="btn-quiet" id="btnPajang" type="button">Mode pajang</button>
  </div>
</header>

<main class="stage">
  <section class="hero is-demo" id="hero" aria-live="polite" aria-atomic="true">
    <div class="hero-row" id="heroRow"></div>
    <p class="hero-name" id="heroName"></p>
    <p class="note" id="note"></p>
  </section>

  <form class="entry" id="form" autocomplete="off">
    <div class="field">
      <input id="nameInput" type="text" inputmode="text" maxlength="48" spellcheck="false"
             autocomplete="off" autocapitalize="words" placeholder="Ketik nama" aria-label="Nama">
      <button class="clear" id="btnClear" type="button" aria-label="Hapus nama" hidden>×</button>
    </div>
    <button class="mic" id="btnMic" type="button" aria-pressed="false">
      <span class="rhomb" aria-hidden="true"></span><span id="micLabel">Sebut nama</span>
    </button>
  </form>

  <p class="hint" id="hint"></p>
  <p class="chips" id="chips"></p>

  <section class="chart" aria-label="Huruf Lontara">
    <div class="chart-group">
      <p class="chart-cap">23 huruf dasar</p>
      <ul id="letters"></ul>
    </div>
    <div class="chart-group">
      <p class="chart-cap">5 tanda vokal</p>
      <ul id="vowels"></ul>
    </div>
  </section>
</main>

<footer class="foot">
  <p>Font Noto Sans Buginese. Jalan tanpa internet, kecuali input suara.</p>
  <p><kbd>Enter</kbd> tampilkan &nbsp; <kbd>Esc</kbd> hapus &nbsp; <kbd>F11</kbd> layar penuh browser</p>
</footer>

<script>
(function(){
'use strict';

/* ===================== Mesin alih aksara ===================== */
const LETTERS=[
  ['k','ᨀ','ka'],['g','ᨁ','ga'],['ng','ᨂ','nga'],['ngk','ᨃ','ngka'],
  ['p','ᨄ','pa'],['b','ᨅ','ba'],['m','ᨆ','ma'],['mp','ᨇ','mpa'],
  ['t','ᨈ','ta'],['d','ᨉ','da'],['n','ᨊ','na'],['nr','ᨋ','nra'],
  ['c','ᨌ','ca'],['j','ᨍ','ja'],['ny','ᨎ','nya'],['nc','ᨏ','nca'],
  ['y','ᨐ','ya'],['r','ᨑ','ra'],['l','ᨒ','la'],['w','ᨓ','wa'],
  ['s','ᨔ','sa'],['','ᨕ','a'],['h','ᨖ','ha']
];
const CONS={};LETTERS.forEach(([k,g,l])=>{CONS[k]={g,l};});
const VSIGN={a:'',i:'ᨗ',u:'ᨘ',e:'ᨙ',o:'ᨚ','ə':'ᨛ'};
const VLATIN={a:'a',i:'i',u:'u',e:'e',o:'o','ə':'ê'};
const VOWELS='aiueoə';
const isV=ch=>!!ch&&VOWELS.includes(ch);
const SUBS={f:'p',v:'w',z:'j',q:'k',kh:'k',sy:'s',sh:'s',ch:'c',th:'t',dh:'d',ph:'p',gh:'g',zh:'j'};
const DIGRAPHS=['ngk','ng','ny','mp','nr','nc','kh','sy','sh','ch','th','dh','ph','gh','zh'];
const PRENASAL=new Set(['ngk','mp','nr','nc']);

function normalize(str){
  let s=String(str||'').toLowerCase();
  s=s.replace(/[êëè]/g,'ə').replace(/é/g,'e');
  s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/eu/g,'ə');          // "eu" ala Sunda: Euis, Teuku
  s=s.replace(/oe/g,'u');          // ejaan lama: Soekarno
  s=s.replace(/dj/g,'j').replace(/tj/g,'c');
  s=s.replace(/([bcdfgjklmpqrtvwxz])y(?=[aiueoə])/g,'$1i'); // Ryan, Dyah, Aditya
  s=s.replace(/y(?![aiueoə])/g,'i');                         // Rizky, Dedy, Mey
  s=s.replace(/x/g,'ks');
  s=s.replace(/['’`]/g,'');        // hamzah / glottal tidak ditulis
  s=s.replace(/[^a-zə]+/g,' ').trim();
  return s;
}

function parseWord(w){
  const toks=[];let i=0;
  while(i<w.length){
    const ch=w[i];
    if(isV(ch)){toks.push({c:null,v:ch});i++;continue;}
    let key=null;
    for(const d of DIGRAPHS){
      if(w.startsWith(d,i)){
        if(PRENASAL.has(d)&&!isV(w[i+d.length]))continue;
        key=d;break;
      }
    }
    if(!key)key=ch;
    i+=key.length;
    let sub=null,k=key;
    if(SUBS[k]){sub=[k,SUBS[k]];k=SUBS[k];}
    if(!CONS[k])continue;
    const next=w[i]||'';
    if(isV(next)){toks.push({c:k,v:next,sub});i++;}
    else toks.push({c:k,v:null,coda:true,sub});
  }
  const out=[];let gem=false;
  for(let j=0;j<toks.length;j++){
    const t=toks[j],n=toks[j+1];
    if(t.coda&&n&&n.c===t.c){gem=true;continue;} // huruf dobel ditulis sekali
    out.push(t);
  }
  out.gem=gem;
  return out;
}

function renderWord(tokens,mode){
  const cells=[],dropped=[],written=[],subs=[];
  for(const t of tokens){
    if(t.sub)subs.push(t.sub);
    if(t.coda){
      if(mode==='trad'){dropped.push(t.c);continue;}
      written.push(t.c);
      cells.push({g:CONS[t.c].g,l:CONS[t.c].l,c:t.c,v:'a'});
      continue;
    }
    const ck=t.c===null?'':t.c;
    const base=CONS[ck];
    const consLatin=ck===''?'':base.l.slice(0,-1);
    cells.push({g:base.g+VSIGN[t.v],l:consLatin+VLATIN[t.v],c:ck,v:t.v});
  }
  return {cells,dropped,written,subs,gem:!!tokens.gem};
}

function transliterate(input,mode){
  const words=normalize(input).split(' ').filter(Boolean).map(w=>renderWord(parseWord(w),mode)).filter(w=>w.cells.length);
  return words;
}

function uniq(arr){return arr.filter((x,i)=>arr.indexOf(x)===i);}
function daftar(items){
  if(items.length<=1)return items.join('');
  return items.slice(0,-1).join(', ')+' dan '+items[items.length-1];
}
function explain(words,mode){
  const dropped=uniq([].concat(...words.map(w=>w.dropped)));
  const written=uniq([].concat(...words.map(w=>w.written)));
  const subKeys=uniq([].concat(...words.map(w=>w.subs.map(s=>s[0]))));
  const gem=words.some(w=>w.gem);
  const p=[];
  if(mode==='trad'&&dropped.length){
    p.push(`Konsonan mati <b>${daftar(dropped)}</b> tidak ditulis. Lontara tidak punya tanda mati, jadi pembaca menebaknya dari konteks.`);
  }else if(mode==='full'&&written.length){
    p.push(`Konsonan mati <b>${daftar(written)}</b> ditulis ${daftar(written.map(c=>CONS[c].l))} supaya gampang dibaca; ejaan tradisional menghilangkannya.`);
  }else{
    p.push('Semua suku katanya terbuka, jadi tidak ada huruf yang perlu dihilangkan.');
  }
  if(subKeys.length){
    const to=uniq(subKeys.map(k=>SUBS[k]));
    p.push(`Lontara tidak punya huruf <b>${daftar(subKeys)}</b>, jadi ditulis ${daftar(to)}.`);
  }
  if(gem)p.push('Huruf dobel ditulis sekali.');
  return p.join(' ');
}

function titleCase(s){
  return s.trim().replace(/\s+/g,' ').split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1).toLowerCase():'').join(' ');
}

/* ===================== Elemen ===================== */
const $=id=>document.getElementById(id);
const hero=$('hero'),heroRow=$('heroRow'),heroName=$('heroName'),note=$('note');
const input=$('nameInput'),btnClear=$('btnClear'),btnMic=$('btnMic'),micLabel=$('micLabel');
const hint=$('hint'),chips=$('chips'),lettersUl=$('letters'),vowelsUl=$('vowels');
const btnCopy=$('btnCopy'),btnPajang=$('btnPajang');

const DEMO='Sulawesi';
const CONTOH=['Andi','Makassar','Tana Toraja','Sengkang','Pinisi'];
let mode='trad';
let words=[];
let lastLontara='';

/* Bagan huruf */
LETTERS.forEach(([k,g,l])=>{
  const li=document.createElement('li');li.dataset.c=k;
  li.innerHTML=`<span class="g">${g}</span><span class="l">${l}</span>`;
  lettersUl.appendChild(li);
});
[['a','ᨀ','ka'],['i','ᨀᨗ','ki'],['u','ᨀᨘ','ku'],['e','ᨀᨙ','ke'],['o','ᨀᨚ','ko'],['ə','ᨀᨛ','kê']].forEach(([v,g,l])=>{
  const li=document.createElement('li');li.dataset.v=v;
  li.innerHTML=`<span class="g">${g}</span><span class="l">${l}</span>`;
  vowelsUl.appendChild(li);
});

/* Petunjuk bawaan */
const HINT_DEFAULT='Tekan Enter untuk menampilkan, Esc untuk menghapus.';
let micNote='';
function hintDefault(){
  hint.dataset.kind=micNote?'error':'';
  hint.textContent=micNote||HINT_DEFAULT;
}
function hintSay(msg,kind){
  hint.dataset.kind=kind||'';
  hint.textContent=msg;
}
(function buildChips(){
  const lead=document.createElement('span');lead.textContent='Coba:';chips.appendChild(lead);
  CONTOH.forEach(n=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=n;
    b.addEventListener('click',()=>{input.value=n;update(true);});
    chips.appendChild(b);
  });
})();
hintDefault();

/* ===================== Ukuran hero ===================== */
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d');
let fontReady=false;
function measureEm(str){
  if(!fontReady)return 1.1;
  ctx.font='100px "Noto Sans Buginese"';
  return ctx.measureText(str).width/100;
}
function fitHero(){
  if(!words.length)return;
  const W=heroRow.clientWidth||window.innerWidth*.9;
  const pajang=document.body.classList.contains('pajang');
  const maxSize=pajang
    ?Math.min(window.innerHeight*.4,window.innerWidth*.28)
    :Math.min(window.innerHeight*.19,window.innerWidth*.19);
  const minSize=34;
  const units=words.map(w=>w.cells.reduce((a,c)=>a+Math.max(.6,measureEm(c.g))+.07,0));
  const total=units.reduce((a,b)=>a+b,0)+(words.length-1)*.55;
  const longest=Math.max(...units);
  const avail=W*.97;
  let size=Math.min(maxSize,avail/total);
  if(size<72&&words.length>1){
    for(let rows=2;rows<=Math.min(4,words.length);rows++){
      const s=Math.min(maxSize,avail/Math.max(longest,total/rows));
      if(s>size)size=s;
      if(s>=72)break;
    }
  }
  if(size<minSize)size=Math.min(minSize,avail/longest);
  heroRow.style.fontSize=Math.floor(size)+'px';
}

/* ===================== Render ===================== */
function update(animate){
  const raw=input.value;
  const isDemo=!normalize(raw);
  const src=isDemo?DEMO:raw;
  words=transliterate(src,mode);
  hero.classList.toggle('is-demo',isDemo);
  btnClear.hidden=!raw.length;

  heroRow.innerHTML='';
  let idx=0;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  words.forEach(w=>{
    const wd=document.createElement('span');wd.className='word';
    w.cells.forEach(c=>{
      const cell=document.createElement('span');
      cell.className='cell'+(animate&&!reduce?' in':'');
      if(animate&&!reduce)cell.style.animationDelay=(idx*85)+'ms';
      cell.innerHTML=`<span class="glyph">${c.g}</span><span class="gloss">${c.l}</span>`;
      wd.appendChild(cell);idx++;
    });
    heroRow.appendChild(wd);
  });
  lastLontara=words.map(w=>w.cells.map(c=>c.g).join('')).join(' ');

  if(isDemo){
    heroName.textContent=DEMO;
    note.innerHTML='Ketik atau sebut namamu, lalu lihat tulisannya dalam aksara Lontara. Di bawah tiap huruf ada cara bacanya.';
  }else if(!words.length){
    heroName.textContent=titleCase(raw);
    note.innerHTML='Belum ada huruf yang bisa dibaca. Pakai huruf a sampai z saja.';
  }else{
    heroName.textContent=titleCase(raw);
    note.innerHTML=explain(words,mode);
  }

  const usedC=new Set(),usedV=new Set();
  words.forEach(w=>w.cells.forEach(c=>{usedC.add(c.c);usedV.add(c.v);}));
  lettersUl.querySelectorAll('li').forEach(li=>li.classList.toggle('on',!isDemo&&usedC.has(li.dataset.c)));
  vowelsUl.querySelectorAll('li').forEach(li=>li.classList.toggle('on',!isDemo&&usedV.has(li.dataset.v)));

  fitHero();
}

/* ===================== Kejadian ===================== */
input.addEventListener('input',()=>update(false));
$('form').addEventListener('submit',e=>{e.preventDefault();commit();});
function commit(){
  update(true);
  if(normalize(input.value))input.blur();
}
function clearAll(){
  input.value='';update(false);input.focus();
}
btnClear.addEventListener('click',clearAll);

document.querySelectorAll('input[name="mode"]').forEach(r=>{
  r.addEventListener('change',()=>{mode=r.value;update(false);});
});

btnCopy.addEventListener('click',async()=>{
  const text=lastLontara;
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true;}
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy');}catch(_){}
    ta.remove();
  }
  btnCopy.textContent=ok?'Tersalin':'Gagal menyalin';
  btnCopy.dataset.done=ok?'1':'';
  setTimeout(()=>{btnCopy.textContent='Salin teks Lontara';btnCopy.dataset.done='';},1600);
});

function setPajang(on){
  document.body.classList.toggle('pajang',on);
  btnPajang.textContent=on?'Keluar mode pajang':'Mode pajang';
  if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  }else if(!on&&document.fullscreenElement&&document.exitFullscreen){
    document.exitFullscreen().catch(()=>{});
  }
  setTimeout(fitHero,60);
}
btnPajang.addEventListener('click',()=>setPajang(!document.body.classList.contains('pajang')));
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&document.body.classList.contains('pajang'))setPajang(false);
  setTimeout(fitHero,60);
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.fullscreenElement)return; // browser yang keluar dari layar penuh
    if(document.body.classList.contains('pajang')){setPajang(false);return;}
    if(input.value){clearAll();}
    return;
  }
  const typing=document.activeElement===input;
  if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key.length===1&&/[\p{L}\s]/u.test(e.key)){
    input.focus();
  }
});

window.addEventListener('resize',fitHero);

/* ===================== Suara ===================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,gotFinal=false,gotAny=false;

function micUnavailable(msg){
  btnMic.disabled=true;
  btnMic.title=msg;
  micLabel.textContent='Suara tidak tersedia';
  micNote=msg;
  hintDefault();
}
if(!SR){
  micUnavailable('Input suara butuh Chrome atau Edge. Ketik nama saja dulu.');
}else if(location.protocol==='file:'){
  micUnavailable('Input suara hanya jalan lewat alamat https:// atau localhost, bukan dari file langsung. Caranya ada di README.');
}else if(!window.isSecureContext){
  micUnavailable('Input suara butuh alamat https:// atau localhost. Lihat README.');
}

function cleanTranscript(t){
  let s=t.trim();
  s=s.replace(/^(halo|hai|oke|ok)[,\s]+/i,'');
  s=s.replace(/^(nama\s*(saya|aku|gue|gw|ku|nya)?|namaku|saya|aku|gue|gw)\s+(adalah\s+|itu\s+)?/i,'');
  s=s.replace(/[.,!?]+$/,'');
  return titleCase(s);
}
function setListening(on){
  listening=on;
  btnMic.classList.toggle('is-listening',on);
  btnMic.setAttribute('aria-pressed',on?'true':'false');
  micLabel.textContent=on?'Mendengarkan':'Sebut nama';
  if(on)hintSay('Sebut namamu dengan jelas. Klik lagi untuk berhenti.');
}
const ERR={
  'not-allowed':'Mikrofon belum diizinkan. Klik ikon gembok di sebelah alamat web, izinkan mikrofon, lalu coba lagi.',
  'service-not-allowed':'Layanan pengenalan suara diblokir di browser ini. Coba Chrome atau Edge.',
  'network':'Pengenalan suara butuh internet. Cek koneksi, lalu coba lagi.',
  'no-speech':'Tidak ada suara yang terdengar. Coba lagi, lebih dekat ke mikrofon.',
  'audio-capture':'Mikrofon tidak ditemukan. Pasang atau pilih mikrofon, lalu coba lagi.',
  'language-not-supported':'Bahasa Indonesia tidak didukung oleh pengenal suara ini.'
};
btnMic.addEventListener('click',()=>{
  if(!SR||btnMic.disabled)return;
  if(listening){try{rec.stop();}catch(_){}return;}
  rec=new SR();
  rec.lang='id-ID';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  gotFinal=false;gotAny=false;
  rec.onstart=()=>setListening(true);
  rec.onresult=e=>{
    let text='',final=false;
    for(let i=e.resultIndex;i<e.results.length;i++){
      text+=e.results[i][0].transcript;
      if(e.results[i].isFinal)final=true;
    }
    const name=cleanTranscript(text);
    if(!name)return;
    gotAny=true;
    input.value=name;
    if(final){gotFinal=true;commit();}else update(false);
  };
  rec.onerror=e=>{
    if(e.error==='aborted')return;
    hintSay(ERR[e.error]||('Input suara gagal ('+e.error+'). Ketik nama saja dulu.'),'error');
    rec._err=true;
  };
  rec.onend=()=>{
    setListening(false);
    if(rec._err)return;
    if(gotFinal){hintDefault();}
    else if(gotAny){commit();hintDefault();}
    else hintSay('Tidak ada nama yang tertangkap. Coba lagi, atau ketik.','error');
  };
  try{rec.start();}catch(err){hintSay('Input suara tidak bisa dimulai. Ketik nama saja dulu.','error');}
});

/* ===================== Mulai ===================== */
update(false);
if(document.fonts&&document.fonts.load){
  document.fonts.load('100px "Noto Sans Buginese"').then(()=>{fontReady=true;fitHero();}).catch(()=>{});
  document.fonts.ready.then(()=>{fontReady=true;fitHero();});
}
input.focus();
})();
</script>
